name: Timetable

on:
  schedule:
    - cron: "37 */3 * * *"     # check for changes every 3 hours
    - cron: "50 16-18 * * *"   # evening attempts
    - cron: "10 17-19 * * *"   # more evening attempts
    - cron: "34 17-18 * * *"   # more evening attempts
  push:
    paths:
      - "lu/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timetable
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl==3.1.5

      - name: Check for changes
        if: github.event_name != 'schedule' || github.event.schedule == '37 */3 * * *'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/update.py check

      - name: Evening message
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule != '37 */3 * * *')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/update.py evening

      - name: Save timetable
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"
          git add data/timetable.json
          if ! git diff --cached --quiet; then
            git commit -m "Update timetable"
            git push
          fi
